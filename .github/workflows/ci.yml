name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: meetingspace_test
          POSTGRES_USER: meetingspace_test
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meetingspace_test -d meetingspace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-only-dummy-secret-key-do-not-use-elsewhere
      DJANGO_DEBUG: "false"
      POSTGRES_DB: meetingspace_test
      POSTGRES_USER: meetingspace_test
      POSTGRES_PASSWORD: ci-test-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test

      # NEW: production security settings must pass with zero warnings
      - name: Production security check
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECURE_HTTPS: "true"
          DJANGO_ALLOWED_HOSTS: example.com
          DJANGO_SECRET_KEY: ci-deploy-check-only-7f3K9qLm2xVw8RtZp4NbYc6HdJs1GaUe5WoQ

  # NEW: the app must package into a production image
  docker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image (no push)
        run: docker build -t meetingspace-backend:ci .

      - name: Image runs as non-root user
        run: |
          user="$(docker run --rm meetingspace-backend:ci whoami)"
          echo "Container user: $user"
          test "$user" != "root"

      - name: No secrets or dev files inside the image
        run: |
          if docker run --rm meetingspace-backend:ci ls -A /app | grep -qxE '\.env|\.venv|\.git'; then
            echo "::error::.env, .venv or .git found inside the image. Check backend/.dockerignore"
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test -- --run
      - run: npm run build